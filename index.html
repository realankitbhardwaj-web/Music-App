<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Resso Clone — Vibe Feed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#000; overscroll-behavior:none; }
  body.font-sans { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #feed { scrollbar-width:none; }
  #feed::-webkit-scrollbar { display:none; }
  /* Resso-style karaoke sync: the CURRENT line is pure white, max font
     weight. Crispness comes from a TIGHT black rim (stroke + close
     shadow) for edge definition, plus only a small-radius white glow —
     large-blur glow was making the white look hazy/washed out instead
     of solid, especially with no scrim behind it. The NEXT line stays
     visibly dimmer so the two are never confused. */
  .lyric-line { transition: opacity .3s ease, transform .3s ease, color .3s ease; }
  .lyric-line.next-line {
    opacity:1;                                  /* CHANGED: was .85 — this was the "faded" line, now fully opaque */
    color:#FFFFFF;                               /* CHANGED: explicit pure white (was #fff, same value, now explicit per request) */
    font-weight:800;
    transform: scale(1);
    paint-order: stroke fill;
    -webkit-text-stroke: 1.6px rgba(0,0,0,1);
    text-shadow:
      0 1px 1px rgba(0,0,0,1),
      0 2px 3px rgba(0,0,0,1),
      0 0 3px rgba(255,255,255,.9);
  }
  .lyric-line.active {
    opacity:1;                                  /* unchanged — was already fully opaque */
    transform: scale(1.04);                     /* unchanged — size/scale kept exactly as before, per request */
    color:#FFFFFF;                               /* CHANGED: explicit pure white (was #ffffff, same value, now explicit per request) */
    font-weight:900;
    -webkit-text-stroke: 3px rgba(0,0,0,1);
    paint-order: stroke fill;
    text-shadow:
      0 1px 1px rgba(0,0,0,1),
      0 2px 4px rgba(0,0,0,1),
      0 0 2px rgba(255,255,255,1),
      0 0 5px rgba(255,255,255,1),
      0 0 9px rgba(255,255,255,.9);
    /* NOTE: no filter:blur(...) was present on this rule — nothing to remove here */
  }
  /* CHANGED: removed the mask-image fade that was on .lyrics-scroll (it went
     transparent → black over the container's top 40%). That mask sat on top
     of BOTH lyric lines regardless of their own opacity, so even with
     opacity:1 on the text, the container itself was still fading the lines
     out — this was a second, hidden source of the "feeka" look. */
  .lyrics-scroll { }
  .action-glass { backdrop-filter: blur(12px) saturate(160%); -webkit-backdrop-filter: blur(12px) saturate(160%); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12); }
  .eq-bar { animation: eq 0.9s ease-in-out infinite; transform-origin: bottom; }
  .eq-bar:nth-child(2){ animation-delay:.15s; }
  .eq-bar:nth-child(3){ animation-delay:.3s; }
  @keyframes eq { 0%,100%{ transform: scaleY(.3);} 50%{ transform: scaleY(1);} }
  .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.12); }
  .fade-in { animation: fadeIn .4s ease forwards; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .heart-pop { animation: pop .35s ease; }
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.4);} 100%{transform:scale(1);} }
  .spinner { border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; border-radius:50%; width:34px; height:34px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { animation: toastIn .25s ease, toastOut .25s ease 1.75s forwards; }
  @keyframes toastIn { from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }
  @keyframes toastOut { to{opacity:0; transform:translate(-50%,-6px);} }
</style>
</head>
<body class="bg-black text-white font-sans overflow-hidden" style="height:100dvh;">

<div id="app" class="relative w-full" style="height:100dvh;">

  <!-- Ambient global backdrop -->
  <div id="ambientBg" class="fixed inset-0 -z-10 bg-cover bg-center opacity-60 blur-2xl scale-125 transition-all duration-700" style="background-color:#0a0a0f;"></div>

  <!-- Boot overlay: the feed itself starts loading the instant the page
       opens (no separate "landing page" tap required just to see the
       player). This overlay only ever shows (a) a small non-blocking
       spinner while that first fetch is in flight, or (b) — once songs
       are ready — a compact "tap to play" pill sitting over the already-
       visible first card, since browsers still require one real user
       gesture before audio can start. It never paints a full black
       screen over the player. -->
  <div id="startOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center px-8 text-center pointer-events-none">
    <div id="loadingWrap" class="flex flex-col items-center gap-3 pointer-events-auto">
      <div class="spinner"></div>
      <p class="text-white/50 text-xs">Loading your feed…</p>
    </div>
    <div id="tapPlayWrap" class="hidden flex-col items-center gap-3 pointer-events-auto">
      <button id="startBtn" class="w-16 h-16 rounded-full glass flex items-center justify-center active:scale-90 transition shadow-2xl">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <p class="text-white/70 text-xs font-semibold tracking-wide">Tap to play</p>
    </div>
  </div>

  <!-- Search button -->
  <button id="searchBtn" class="fixed top-4 left-4 z-40 w-9 h-9 rounded-full glass flex items-center justify-center text-sm">🔍</button>

  <!-- Stats button -->
  <button id="statsBtn" class="fixed top-4 right-4 z-40 w-9 h-9 rounded-full glass flex items-center justify-center text-sm">📊</button>

  <!-- Search / Browse modal -->
  <div id="searchModal" class="hidden fixed inset-0 z-50 bg-black flex-col" style="height:100dvh;">
    <div class="flex items-center gap-2 px-4 pt-4 pb-3 flex-shrink-0">
      <button id="closeSearch" class="w-9 h-9 rounded-full glass flex items-center justify-center text-lg flex-shrink-0">←</button>
      <input id="searchInput" type="text" placeholder="Search songs, artists, movies…" class="flex-1 min-w-0 bg-white/10 border border-white/15 rounded-full px-4 py-2.5 text-sm outline-none focus:border-white/40" />
    </div>
    <p id="searchStatus" class="px-5 pb-2 text-xs text-white/40 flex-shrink-0">Search for songs, artists, or movies</p>
    <div id="searchResults" class="flex-1 overflow-y-auto px-3 pb-6 space-y-1"></div>
  </div>

  <!-- Stats modal -->
  <div id="statsModal" class="hidden fixed inset-0 z-50 bg-black/70 items-center justify-center px-6">
    <div class="glass rounded-2xl p-5 w-full max-w-sm">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-lg">Your Vibe Stats</h2>
        <button id="closeStats" class="text-white/50 text-xl leading-none">×</button>
      </div>
      <div id="statsBody" class="text-sm space-y-2 text-white/80 max-h-[50vh] overflow-y-auto"></div>
      <p class="text-[10px] text-white/30 mt-4">Stored locally in your browser (localStorage). Nothing leaves your device.</p>
    </div>
  </div>

  <!-- Feed -->
  <div id="feed" class="w-full snap-y snap-mandatory overflow-y-scroll" style="height:100dvh;"></div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-24 left-1/2 z-50 glass px-4 py-2 rounded-full text-xs font-medium toast"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------------
   * STORAGE HELPERS
   * ------------------------------------------------------------------- */
  const LS_LIKES = 'resso_likes';
  const LS_HISTORY = 'resso_history';
  const LS_LOOPS = 'resso_loops';

  const getLS = (k, fallback) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? fallback : v; } catch(e){ return fallback; } };
  const setLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

  let likes = getLS(LS_LIKES, []);          // array of track ids
  let history = getLS(LS_HISTORY, []);      // array of {id,title,artist,percent,seconds,ts}
  let loops = getLS(LS_LOOPS, {});          // { trackId: count }

  function logHistory(entry){
    history.push(entry);
    if (history.length > 300) history = history.slice(-300); // cap growth
    setLS(LS_HISTORY, history);
  }
  function toggleLike(id){
    const i = likes.indexOf(id);
    if (i === -1) { likes.push(id); } else { likes.splice(i,1); }
    setLS(LS_LIKES, likes);
    return likes.includes(id);
  }
  function incrementLoop(id){
    loops[id] = (loops[id]||0) + 1;
    setLS(LS_LOOPS, loops);
    return loops[id];
  }

  /* ---------------------------------------------------------------------
   * LRC PARSER
   * ------------------------------------------------------------------- */
  function parseLRC(raw){
    const lines = raw.split('\n');
    const out = [];
    const re = /\[(\d{2}):(\d{2})[.:](\d{2,3})\]/g;
    // [offset:+/-ms] metadata tag — some LRC files shift every timestamp by
    // a fixed amount. Ignoring it was a real source of "highlight doesn't
    // match the audio" desync whenever a file actually had one.
    const offsetMatch = raw.match(/\[offset:\s*(-?\d+)\]/i);
    const offsetSeconds = offsetMatch ? parseInt(offsetMatch[1], 10) / 1000 : 0;
    for (const line of lines){
      re.lastIndex = 0;
      const tags = [...line.matchAll(re)];
      if (!tags.length) continue;
      const text = line.replace(re, '').trim();
      for (const t of tags){
        const min = parseInt(t[1],10), sec = parseInt(t[2],10);
        let ms = t[3]; ms = ms.length === 2 ? parseInt(ms,10)*10 : parseInt(ms,10);
        // LRC convention: positive offset means the tagged times are late
        // (lyrics should show earlier), so subtract it.
        const time = Math.max(0, min*60 + sec + ms/1000 - offsetSeconds);
        out.push({ time, text: text || '♪' });
      }
    }
    out.sort((a,b)=>a.time-b.time);
    return out;
  }

  /* ---------------------------------------------------------------------
   * DATA FETCHING (free, no-key APIs)
   * ------------------------------------------------------------------- */
  function fetchWithTimeout(url, ms){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
  }

  // JioSaavn public API — gives direct 320kbps MP3 stream URLs, high-res
  // album art, and full track metadata. No key, no preview limit: the URL
  // we get back IS the full song.
  // Five independent public deployments of the same open-source API,
  // across different individual developers/domains (not just the two
  // well-known ones) — a network-level block is far less likely to hit
  // all of them. All are tried DIRECT, in parallel — first one to answer
  // wins. Only if every single direct attempt fails do we fall through
  // to relaying every host through every CORS relay, also in parallel.
  const SAAVN_HOSTS = [
    'https://jiosaavn-api-v3.vercel.app',
    'https://powerapi-song.vercel.app',
    'https://jiosavan-azure.vercel.app',
    'https://saavn.dev',
    'https://saavn.me'
  ];
  const RELAY_BUILDERS = [
    (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    (u) => `https://thingproxy.freeboard.io/fetch/${u}`
  ];

  function saavnUrl(host, term, limit){
    return `${host}/api/search/songs?query=${encodeURIComponent(term)}&limit=${limit}`;
  }

  async function tryFetchResults(url, ms){
    const res = await fetchWithTimeout(url, ms);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const results = (data && data.data && data.data.results) || [];
    if (!results.length) throw new Error('empty results');
    return results;
  }

  function firstErrorMessage(aggregateOrErr){
    if (aggregateOrErr && aggregateOrErr.errors && aggregateOrErr.errors.length){
      return aggregateOrErr.errors[0].message || String(aggregateOrErr.errors[0]);
    }
    return (aggregateOrErr && aggregateOrErr.message) || String(aggregateOrErr);
  }

  async function fetchSaavnBatch(term, limit){
    const urls = SAAVN_HOSTS.map(h => saavnUrl(h, term, limit));

    // Phase 1 — every host, direct, in parallel.
    try {
      return await Promise.any(urls.map(u => tryFetchResults(u, 7000)));
    } catch(e1){
      lastFetchError = firstErrorMessage(e1);
    }

    // Phase 2 — every host through every relay, in parallel.
    try {
      const attempts = [];
      for (const u of urls){
        for (const build of RELAY_BUILDERS){
          attempts.push(tryFetchResults(build(u), 9000));
        }
      }
      return await Promise.any(attempts);
    } catch(e2){
      lastFetchError = firstErrorMessage(e2);
      return [];
    }
  }
  let lastFetchError = '';

  // JioSaavn metadata is clean (proper title/artist, not messy YouTube
  // titles), so lrclib's fuzzy /search is tried first, exact /get second.
  // IMPORTANT: lrclib's /search is a *fuzzy* text match — it has no idea
  // which actual recording our JioSaavn audio is. A title+artist query for
  // e.g. a movie song often returns lyrics for a different cut/remix/
  // reprise with a different length, whose timestamps then don't line up
  // with our audio at all (lines just never look "active" because their
  // times are all past — or before — wherever our track actually is).
  // Fix: only accept a search result whose reported duration is within a
  // few seconds of our actual JioSaavn track duration. If nothing close
  // enough is found, fall through to /api/get, which lrclib itself will
  // duration-match server-side (and 404 if nothing fits, instead of
  // silently handing back a mismatched track).
  // Normalizes a title for loose comparison: lowercase, strip bracketed
  // "(From "Movie")"/"(Remix)" suffixes and punctuation, collapse spaces.
  function normalizeTitleForMatch(text){
    return (text || '')
      .toLowerCase()
      .replace(/[\(\[][^\)\]]*[\)\]]/g, ' ')
      .replace(/[^a-z0-9\u0900-\u097F\u0A00-\u0A7F ]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Two titles are considered "the same song" if they share enough
  // significant words — guards against duration coincidentally matching a
  // completely unrelated track (the "wrong song's lyrics" bug), since two
  // unrelated songs can easily land within 1.5s of the same duration.
  function titlesLikelyMatch(queryTitle, resultTitle){
    const a = new Set(normalizeTitleForMatch(queryTitle).split(' ').filter(w => w.length > 1));
    const b = new Set(normalizeTitleForMatch(resultTitle).split(' ').filter(w => w.length > 1));
    if (!a.size || !b.size) return true; // nothing usable to compare — don't block on it
    let overlap = 0;
    for (const w of a) if (b.has(w)) overlap++;
    // Require at least half of the shorter title's significant words to
    // be shared, with at least one match.
    return overlap > 0 && overlap >= Math.min(a.size, b.size) * 0.5;
  }

  async function lrclibSearch(query, expectedDuration, trackTitle){
    const res = await fetchWithTimeout(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`, 6000);
    if (!res.ok) return null;
    const results = await res.json();
    if (!Array.isArray(results) || !results.length) return null;
    let synced = results.filter(r => r.syncedLyrics);
    if (!synced.length) return null;

    // Filter out results whose track title doesn't resemble ours at all —
    // catches cases where a totally different song happens to share a
    // similar duration.
    if (trackTitle){
      const titleFiltered = synced.filter(r => titlesLikelyMatch(trackTitle, r.trackName || ''));
      if (titleFiltered.length) synced = titleFiltered;
    }

    if (expectedDuration > 0){
      let best = null, bestDiff = Infinity;
      for (const r of synced){
        const diff = Math.abs((r.duration || 0) - expectedDuration);
        if (diff < bestDiff){ bestDiff = diff; best = r; }
      }
      // Tightened from 3s to 1.5s — even a couple of seconds off usually
      // means a different edit/remix/reprise, whose line timings then
      // drift further and further out of sync with our audio as the
      // song plays (the "highlight doesn't match what's playing" bug).
      if (best && bestDiff <= 1.5) return best.syncedLyrics;
      return null;
    }

    // No known duration to check against — best effort, first result.
    return synced[0].syncedLyrics;
  }

  // Basic Devanagari → Hinglish (Roman) transliteration. lrclib returns
  // lyrics in whatever script the uploader used — usually Devanagari for
  // Hindi/Punjabi(Gurmukhi-in-Devanagari-transliteration-adjacent) songs —
  // but the app wants Hinglish only. Character-level scheme (consonant +
  // matra/halant handling); not linguistically perfect but reads fine for
  // casual lyric display. Lines with no Devanagari pass through untouched.
  const DEVANAGARI_RE = /[\u0900-\u097F]/;
  const HIN_CONSONANTS = {
    'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ng',
    'च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'ny',
    'ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n',
    'त':'t','थ':'th','द':'d','ध':'dh','न':'n',
    'प':'p','फ':'ph','ब':'b','भ':'bh','म':'m',
    'य':'y','र':'r','ल':'l','व':'v','ळ':'l',
    'श':'sh','ष':'sh','स':'s','ह':'h',
    'क़':'q','ख़':'kh','ग़':'gh','ज़':'z','ड़':'r','ढ़':'rh','फ़':'f','य़':'y'
  };
  const HIN_INDEP_VOWELS = {
    'अ':'a','आ':'aa','इ':'i','ई':'ee','उ':'u','ऊ':'oo','ऋ':'ri',
    'ए':'e','ऐ':'ai','ओ':'o','औ':'au'
  };
  const HIN_MATRAS = {
    'ा':'a','ि':'i','ी':'ee','ु':'u','ू':'oo','ृ':'ri',
    'े':'e','ै':'ai','ो':'o','ौ':'au'
  };
  function devanagariToHinglish(text){
    const chars = Array.from(text);
    const n = chars.length;
    const NUKTA_VARIANT = { 'क':'q','ख':'kh','ग':'gh','ज':'z','ड':'r','ढ':'rh','फ':'f','य':'y' };
    let out = '';
    let i = 0;
    while (i < n){
      const ch = chars[i];
      if (HIN_CONSONANTS[ch] !== undefined){
        let base = HIN_CONSONANTS[ch];
        i++;
        // nukta (़) directly after a base consonant — e.g. ख + ़ = ख़ ("kh"
        // with the Urdu-origin sound common in Bollywood lyrics like
        // "ख़्वाब"). Unicode does NOT compose these to a single codepoint
        // on NFC normalize, so it must be handled as two characters here.
        if (chars[i] === '़'){
          if (NUKTA_VARIANT[ch]) base = NUKTA_VARIANT[ch];
          i++;
        }
        const next = chars[i];
        if (next === '्'){ out += base; i++; }
        else if (next !== undefined && HIN_MATRAS[next] !== undefined){ out += base + HIN_MATRAS[next]; i++; }
        else if (next === 'ं'){ out += base + 'an'; i++; }
        else if (next === 'ः'){ out += base + 'ah'; i++; }
        else { out += base + 'a'; }
        continue;
      }
      if (HIN_INDEP_VOWELS[ch] !== undefined){ out += HIN_INDEP_VOWELS[ch]; i++; continue; }
      if (ch === 'ं' || ch === 'ँ'){ out += 'n'; i++; continue; }
      if (ch === 'ः'){ out += 'h'; i++; continue; }
      if (ch === '्' || ch === '़'){ i++; continue; }
      if (ch === '।'){ out += '.'; i++; continue; }
      if (/[\u0966-\u096F]/.test(ch)){ out += String(ch.charCodeAt(0) - 0x0966); i++; continue; }
      out += ch; i++;
    }
    return out.replace(/\s+/g, ' ').trim();
  }

  // Same idea for Gurmukhi (Punjabi script) — separate Unicode block, so
  // it needs its own consonant/vowel-sign map rather than reusing the
  // Devanagari one.
  //
  // This is a syllable-aware version (not a dumb char-by-char swap):
  // 1. It builds each word into a list of syllable units (consonant +
  //    vowel, where the vowel is either an explicit matra sign or the
  //    "implicit" inherent schwa every bare consonant carries).
  // 2. Addak (ੱ) — the gemination mark that sits BEFORE the consonant it
  //    doubles — is applied by doubling that consonant's leading letter
  //    (e.g. ਅੱਖ → "akkh", not "akh").
  // 3. A schwa-deletion pass then drops the inherent "a" in the two
  //    places Punjabi/Hindi speech actually drops it: (a) any mid-word
  //    syllable whose immediate right-neighbour has an EXPLICIT vowel
  //    (the classic "CəCV → CCV" rule — e.g. ਕਰਦਾ → "kar-da" not
  //    "ka-ra-da"), and (b) the final syllable of a multi-syllable word
  //    (e.g. ਸੱਜਣ → "sajjan" not "sajjana").
  // Without this, the old plain char-swap left every bare consonant with
  // its full "-a" sound and no gemination, which read as garbled rather
  // than actual Hinglish.
  const GURMUKHI_RE = /[\u0A00-\u0A7F]/;
  const GUR_CONSONANTS = {
    'ਕ':'k','ਖ':'kh','ਗ':'g','ਘ':'gh','ਙ':'ng',
    'ਚ':'ch','ਛ':'chh','ਜ':'j','ਝ':'jh','ਞ':'ny',
    'ਟ':'t','ਠ':'th','ਡ':'d','ਢ':'dh','ਣ':'n',
    'ਤ':'t','ਥ':'th','ਦ':'d','ਧ':'dh','ਨ':'n',
    'ਪ':'p','ਫ':'ph','ਬ':'b','ਭ':'bh','ਮ':'m',
    'ਯ':'y','ਰ':'r','ਲ':'l','ਵ':'v','ਲ਼':'l',
    'ਸ':'s','ਹ':'h','ੜ':'r'
  };
  const GUR_INDEP_VOWELS = {
    'ਅ':'a','ਆ':'aa','ਇ':'i','ਈ':'ee','ਉ':'u','ਊ':'oo',
    'ਏ':'e','ਐ':'ai','ਓ':'o','ਔ':'au'
  };
  // NOTE: 'ਾ' is the long-"aa" matra (not short "a" — that was the old
  // bug that turned e.g. ਨਾਲ into "nala" instead of "naal").
  const GUR_MATRAS = {
    'ਾ':'aa', 'ਿ':'i', 'ੀ':'ee', 'ੁ':'u', 'ੂ':'oo',
    'ੇ':'e', 'ੈ':'ai', 'ੋ':'o', 'ੌ':'au'
  };
  const GUR_NUKTA_VARIANT = { 'ਸ':'sh','ਖ':'kh','ਗ':'gh','ਜ':'z','ਫ':'f','ਲ':'l' };

  function transliterateGurmukhiWord(word){
    const chars = Array.from(word);
    const n = chars.length;
    const units = []; // { type:'syll', base, vowel, explicit } | { type:'lit', text }
    let i = 0;
    let geminateNext = false; // set when an addak was just seen

    while (i < n){
      const ch = chars[i];

      if (ch === 'ੱ'){ geminateNext = true; i++; continue; } // addak

      if (GUR_CONSONANTS[ch] !== undefined){
        let base = GUR_CONSONANTS[ch];
        i++;
        if (chars[i] === '਼'){ // nukta, e.g. ਸ+਼ = ਸ਼ ("sh")
          if (GUR_NUKTA_VARIANT[ch]) base = GUR_NUKTA_VARIANT[ch];
          i++;
        }
        if (geminateNext){ base = base[0] + base; geminateNext = false; }

        const next = chars[i];
        let vowel, explicit;
        if (next !== undefined && GUR_MATRAS[next] !== undefined){
          vowel = GUR_MATRAS[next]; explicit = true; i++;
        } else if (next === 'ਂ' || next === 'ਁ' || next === 'ੰ'){
          vowel = 'a'; explicit = false; // bare consonant + nasal below, no vowel sign
        } else {
          vowel = 'a'; explicit = false; // inherent schwa
        }
        // Nasalisation (bindi ਂ/ਁ or tippi ੰ) can follow either a matra
        // or a bare consonant — append "n" and mark explicit either way
        // so it never gets caught by schwa-deletion.
        if (chars[i] === 'ਂ' || chars[i] === 'ਁ' || chars[i] === 'ੰ'){ vowel += 'n'; explicit = true; i++; }
        units.push({ type:'syll', base, vowel, explicit });
        continue;
      }

      if (GUR_INDEP_VOWELS[ch] !== undefined){ units.push({ type:'lit', text: GUR_INDEP_VOWELS[ch], isVowel:true }); i++; continue; }
      // Decomposed vowel carriers: lyrics sources often write ਇ/ਈ/ਉ/ਊ/ਏ/ਐ/ਓ/ਔ
      // as two codepoints — ੲ or ੳ followed by a matra sign — instead of
      // the single precomposed letter above. Without this, those two
      // codepoints matched nothing and leaked out as raw Gurmukhi glyphs
      // sitting inside otherwise-Hinglish text (the "mixed script" bug).
      // The matra's own vowel value is exactly the right Roman sound here.
      if (ch === 'ੲ' || ch === 'ੳ'){
        const next = chars[i+1];
        if (next !== undefined && GUR_MATRAS[next] !== undefined){
          units.push({ type:'lit', text: GUR_MATRAS[next], isVowel:true }); i += 2; continue;
        }
        units.push({ type:'lit', text: ch === 'ੲ' ? 'i' : 'u', isVowel:true }); i++; continue;
      }
      if (ch === 'ਂ' || ch === 'ਁ' || ch === 'ੰ'){ units.push({ type:'lit', text:'n' }); i++; continue; }
      if (ch === '਼'){ i++; continue; } // stray nukta with no preceding consonant
      if (ch === '।' || ch === '॥'){ units.push({ type:'lit', text:'.' }); i++; continue; }
      if (/[\u0A66-\u0A6F]/.test(ch)){ units.push({ type:'lit', text: String(ch.charCodeAt(0) - 0x0A66) }); i++; continue; }
      units.push({ type:'lit', text: ch }); i++;
    }

    // Schwa-deletion pass — decisions are based on each unit's ORIGINAL
    // neighbour info (not on whether that neighbour itself gets deleted),
    // which is what the standard rule-based algorithm requires.
    const syllIdx = units.map((u, idx) => u.type === 'syll' ? idx : -1).filter(idx => idx !== -1);
    // Independent vowel letters (ਅ/ਆ/etc.) count as their own syllable
    // beat too — otherwise a word like ਅੱਖ (vowel + one consonant) never
    // qualifies as "multi-syllable" and keeps a stray final schwa.
    const vowelBeats = units.filter(u => u.isVowel).length;
    const totalBeats = syllIdx.length + vowelBeats;
    for (let k = 0; k < syllIdx.length; k++){
      const idx = syllIdx[k];
      const u = units[idx];
      if (u.explicit) continue; // has a real matra, nothing to delete
      const isLastSyll = k === syllIdx.length - 1;
      const nextUnit = idx + 1 < units.length ? units[idx + 1] : null;
      const nextIsExplicitCV = nextUnit && nextUnit.type === 'syll' && nextUnit.explicit;
      if (nextIsExplicitCV || (isLastSyll && totalBeats > 1)){
        u.vowel = ''; // drop the inherent "a"
      }
    }

    return units.map(u => u.type === 'syll' ? (u.base + u.vowel) : u.text).join('');
  }

  function gurmukhiToHinglish(text){
    return text.split(/(\s+)/).map(tok => (tok.trim() ? transliterateGurmukhiWord(tok) : tok)).join('').replace(/\s+/g, ' ').trim();
  }

  function toHinglish(text){
    // Only Gurmukhi (Punjabi) gets transliterated now — Devanagari lyrics
    // are shown as-is, in their original script.
    if (GURMUKHI_RE.test(text)) return gurmukhiToHinglish(text);
    return text;
  }

  async function fetchLyrics(artist, track, durationSeconds){
    try {
      const synced = await lrclibSearch(`${artist} ${track}`.trim(), durationSeconds, track);
      if (synced) return parseLRC(synced).map(l => ({ time: l.time, text: toHinglish(l.text) }));
    } catch(e){ console.warn('[lyrics] search failed', artist, track, e); }
    try {
      let url = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(track)}`;
      if (durationSeconds > 0) url += `&duration=${Math.round(durationSeconds)}`;
      const res = await fetchWithTimeout(url, 6000);
      if (!res.ok) { console.warn('[lyrics] get failed', artist, track, res.status); return null; }
      const data = await res.json();
      if (!data.syncedLyrics) return null;
      // /api/get is a stricter exact-name lookup than /api/search, but
      // still do a final title sanity check + duration re-check here —
      // if it ever returns a near-duration but different-song result,
      // this is the last line of defence against wrong lyrics playing.
      if (!titlesLikelyMatch(track, data.trackName || track)) return null;
      if (durationSeconds > 0 && data.duration && Math.abs(data.duration - durationSeconds) > 1.5) return null;
      return parseLRC(data.syncedLyrics).map(l => ({ time: l.time, text: toHinglish(l.text) }));
    } catch(e){ console.warn('[lyrics] get errored', artist, track, e); return null; }
  }

  function decodeEntities(str){
    if (!str) return str;
    const el = document.createElement('textarea');
    el.innerHTML = str;
    return el.value;
  }

  function bestImage(images){
    if (!Array.isArray(images) || !images.length) return '';
    const url = images[images.length - 1].url || images[images.length - 1].link || '';
    return upgradeImageQuality(url);
  }

  // Raw (pre-upgrade) source URL — needed as the seed for
  // imageQualityFallbacks() so the fallback chain and the "ultra HD"
  // primary URL are both derived from the same original path.
  function rawImageUrl(images){
    if (!Array.isArray(images) || !images.length) return '';
    return images[images.length - 1].url || images[images.length - 1].link || '';
  }

  // JioSaavn's own "highest" entry in the images array is still often only
  // 500x500. The CDN actually serves larger crops at the same path if you
  // swap the size token in the URL — push straight for 1000x1000 (true
  // ultra-HD wallpaper) with 500x500/150x150 as size-token fallbacks for
  // the (rarer) track that doesn't have a 1000x1000 crop available.
  function upgradeImageQuality(url){
    if (!url) return url;
    return url.replace(/\b(50x50|150x150|500x500)\b/, '1000x1000');
  }

  // Ordered step-down list an <img onerror> can walk through if the
  // top-quality crop 404s for a given track: 1000 → 500 → 150 → original.
  function imageQualityFallbacks(url){
    if (!url) return [];
    const sizes = ['1000x1000', '500x500', '150x150'];
    const out = [];
    for (const s of sizes){
      const swapped = url.replace(/\b(1000x1000|50x50|150x150|500x500)\b/, s);
      if (!out.includes(swapped)) out.push(swapped);
    }
    if (!out.includes(url)) out.push(url);
    return out;
  }

  // Exposed for the inline onerror="" handlers in cardHTML — steps an
  // <img> down through its quality chain (data-quality-chain, a JSON
  // array set at render time) one notch per failure, instead of jumping
  // straight from a 404'd 1000x1000 to the low-res grey placeholder.
  window.__artStepDown = function(imgEl, placeholderUrl){
    let chain = [];
    try { chain = JSON.parse(imgEl.dataset.qualityChain || '[]'); } catch(e){ chain = []; }
    const next = chain.shift();
    imgEl.dataset.qualityChain = JSON.stringify(chain);
    if (next){
      imgEl.src = next;
    } else {
      imgEl.onerror = null;
      imgEl.src = placeholderUrl;
    }
  };

  function bestAudioUrl(downloadUrls){
    if (!Array.isArray(downloadUrls) || !downloadUrls.length) return null;
    // prefer 320kbps explicitly, else fall back to whatever the last (highest) entry is
    const hq = downloadUrls.find(d => d.quality === '320kbps');
    return (hq && hq.url) || downloadUrls[downloadUrls.length - 1].url || null;
  }

  // Session-wide dedup key: title+artist, normalized — NOT the raw API id.
  // Different JioSaavn mirror hosts can return a different numeric/string id
  // for the exact same recording, so id-only dedup let true duplicates slip
  // through and show up again a few swipes later. This persists across every
  // fetchQueue call (initial load + every loadMore), not just one batch.
  const seenTrackKeys = new Set();
  function rawTrackKey(raw){
    const title = (raw.name || '').toLowerCase();
    const artistList = (raw.artists && raw.artists.primary) || [];
    const artist = (artistList.map(a => a.name).join(',') || raw.primaryArtists || '').toLowerCase();
    return `${title}::${artist}`.replace(/[^a-z0-9:,]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  async function prepareSong(raw){
    const id = String(raw.id || (raw.name + Math.random()));
    const title = decodeEntities(raw.name) || 'Unknown Title';
    const artistList = (raw.artists && raw.artists.primary) || [];
    const artistNames = artistList.map(a => decodeEntities(a.name)).filter(Boolean);
    const artist = artistNames.join(', ') || decodeEntities(raw.primaryArtists || '') || 'Unknown Artist';
    const rawArt = rawImageUrl(raw.image);
    const artworkChain = rawArt ? imageQualityFallbacks(rawArt) : [];
    // artworkChain[0] is the 1000x1000 "ultra HD" attempt; the rest are
    // the step-down fallbacks an <img onerror> walks through if that
    // particular track has no 1000x1000 crop on the CDN.
    const artwork = artworkChain[0] || 'https://placehold.co/600x600/111/fff?text=%E2%99%AB';
    const artworkFallbacks = artworkChain.slice(1);
    const audioUrl = bestAudioUrl(raw.downloadUrl);
    const durationSeconds = Number(raw.duration) || 0;
    const language = raw.language ? decodeEntities(raw.language) : '';

    const lyrics = await fetchLyrics(artist, title, durationSeconds);

    return {
      id, title, artist, artistList: artistNames, language, artwork, artworkFallbacks, audioUrl, lyrics,
      album: decodeEntities(raw.album && raw.album.name || '')
    };
  }

  // Lightweight version for populating search/browse result lists fast —
  // skips the lyrics fetch (which only matters once a track is actually
  // played). The full prepareSong() runs on-demand when the user taps a result.
  function prepareLiteSong(raw){
    const title = decodeEntities(raw.name) || 'Unknown Title';
    const artistList = (raw.artists && raw.artists.primary) || [];
    const artist = decodeEntities(artistList.map(a => a.name).join(', ') || raw.primaryArtists || 'Unknown Artist');
    const artwork = bestImage(raw.image) || 'https://placehold.co/600x600/111/fff?text=%E2%99%AB';
    return { raw, title, artist, artwork, album: decodeEntities(raw.album && raw.album.name || '') };
  }

  // Much wider term pool than before (was only 5) — a small pool meant the
  // same handful of top search hits kept resurfacing after a few swipes.
  // Bollywood/Punjabi/Haryanvi only — matches the app's language scope.
  const SEARCH_TERMS = [
    'Arijit Singh Hits', 'Trending Hindi Songs', 'Bollywood Romantic 2025', 'Pritam Hits', 'Latest Punjabi Hits',
    'Shreya Ghoshal Hits', 'Neha Kakkar Hits', 'Sonu Nigam Hits', 'Jubin Nautiyal Hits', 'Diljit Dosanjh Hits',
    'B Praak Hits', 'AP Dhillon Hits', 'Armaan Malik Hits', 'Atif Aslam Hits', 'Old Bollywood Classics',
    'Sufi Bollywood Songs', 'Bollywood Party Songs', 'Bollywood Sad Songs', 'Punjabi Wedding Songs', 'Guru Randhawa Hits',
    'Bollywood 90s Hits', 'KK Hits', 'Rahat Fateh Ali Khan Hits', 'Badshah Hits', 'Yo Yo Honey Singh Hits',
    'Haryanvi Hits', 'Haryanvi DJ Songs', 'Haryanvi Dance Songs', 'Masoom Sharma Hits', 'Renuka Panwar Hits'
  ];

  // These terms are kept SEPARATE from the main pool and only spliced in
  // occasionally with a minimum gap (see songsSinceReels below) — folding
  // them into the main pool let a single fetch batch return several of
  // them at once, which read as "the same trending songs clustering
  // together" during a swipe session instead of appearing every so often.
  const REELS_TERMS = [
    'Instagram Trending Songs', 'Trending Reels Songs', 'Viral Reel Audio Hindi',
    'Instagram Reels Hits', 'Trending Reels India', 'Viral Instagram Audio'
  ];
  const REELS_TERM_SET = new Set(REELS_TERMS);
  const MIN_GAP_BETWEEN_REELS = 5; // at least this many normal songs between reels-pool songs
  let songsSinceReels = MIN_GAP_BETWEEN_REELS; // allow one near the start

  // Only these languages belong in the app — anything else JioSaavn's
  // fuzzy text search occasionally surfaces (Tamil, Telugu, English, etc.)
  // gets filtered out.
  const ALLOWED_LANGS = new Set(['hindi', 'punjabi', 'haryanvi']);
  function isAllowedLanguage(raw){
    const lang = (raw.language || '').toLowerCase().trim();
    return ALLOWED_LANGS.has(lang);
  }

  async function fetchQueue(count){
    // Query several distinct terms in parallel and merge — guards against
    // any single term returning too few unique tracks. Occasionally swap
    // one normal term for a reels term, respecting the minimum gap.
    const shuffledMain = [...SEARCH_TERMS].sort(() => Math.random() - 0.5).slice(0, 4);
    let termPlan = shuffledMain.map(t => ({ term: t, reels: false }));
    if (songsSinceReels >= MIN_GAP_BETWEEN_REELS){
      const reelsTerm = REELS_TERMS[Math.floor(Math.random() * REELS_TERMS.length)];
      termPlan[Math.floor(Math.random() * termPlan.length)] = { term: reelsTerm, reels: true };
    }

    const batches = await Promise.all(termPlan.map(async ({ term, reels }) => {
      const items = await fetchSaavnBatch(term, count + 6);
      return items.map(raw => ({ raw, reels }));
    }));
    const flat = batches.flat().filter(item => isAllowedLanguage(item.raw));

    // dedupe against this session's full history + within this batch, then shuffle
    const localKeys = new Set();
    const unique = flat.filter(item => {
      const r = item.raw;
      if (!r.id) return false;
      const key = rawTrackKey(r);
      if (!key || localKeys.has(key) || seenTrackKeys.has(key)) return false;
      localKeys.add(key);
      return true;
    });
    for (let i = unique.length - 1; i > 0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [unique[i], unique[j]] = [unique[j], unique[i]];
    }
    // Spread out same-album tracks so the artwork ("wallpaper") behind
    // back-to-back cards doesn't repeat just because two different songs
    // happen to be from the same movie/soundtrack.
    const albumOf = (item) => (item.raw.album && item.raw.album.name) || '';
    for (let i = 1; i < unique.length; i++){
      if (albumOf(unique[i]) && albumOf(unique[i]) === albumOf(unique[i-1])){
        for (let j = i+1; j < unique.length; j++){
          if (albumOf(unique[j]) !== albumOf(unique[i-1])){
            [unique[i], unique[j]] = [unique[j], unique[i]];
            break;
          }
        }
      }
    }
    // Also guard the seam against whatever song is already last in the feed.
    if (songs.length && unique.length){
      const lastAlbum = songs[songs.length-1].album || '';
      if (lastAlbum && albumOf(unique[0]) === lastAlbum){
        for (let j = 1; j < unique.length; j++){
          if (albumOf(unique[j]) !== lastAlbum){
            [unique[0], unique[j]] = [unique[j], unique[0]];
            break;
          }
        }
      }
    }

    // Enforce: at most one reels-pool song per batch, and only once the
    // minimum gap since the last one has actually elapsed.
    const chosen = [];
    let gap = songsSinceReels;
    let usedReelsThisBatch = false;
    for (const item of unique){
      if (chosen.length >= count) break;
      if (item.reels){
        if (usedReelsThisBatch || gap < MIN_GAP_BETWEEN_REELS) continue;
        chosen.push(item);
        usedReelsThisBatch = true;
        gap = 0;
      } else {
        chosen.push(item);
        gap++;
      }
    }
    songsSinceReels = gap;

    chosen.forEach(item => seenTrackKeys.add(rawTrackKey(item.raw)));
    const prepared = await Promise.all(chosen.map(item => prepareSong(item.raw).catch(()=>null)));
    return prepared.filter(Boolean).filter(s => s.audioUrl);
  }

  /* ---------------------------------------------------------------------
   * PLAYER — plain HTML5 <audio>, playing JioSaavn's direct 320kbps MP3 URL
   * ------------------------------------------------------------------- */
  let audioEl = null;
  let mode = 'none'; // 'audio' | 'none'
  let currentSong = null;

  function stopPlayback(){
    if (audioEl){ audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load(); audioEl = null; }
    mode = 'none';
  }

  function playSong(song){
    stopPlayback();
    currentSong = song;
    if (!song.audioUrl){ mode = 'none'; setPlayIcon(false); return; }
    mode = 'audio';
    setBuffering(true);
    audioEl = new Audio(song.audioUrl);
    audioEl.preload = 'auto';
    audioEl.play().catch(()=>{});
    audioEl.addEventListener('playing', () => setBuffering(false));
    audioEl.addEventListener('waiting', () => setBuffering(true));
    audioEl.addEventListener('play', () => setPlayIcon(true));
    audioEl.addEventListener('pause', () => setPlayIcon(false));
    audioEl.addEventListener('ended', () => {
      const count = incrementLoop(song.id);
      logHistory({ id: song.id, title: song.title, artist: song.artist, percent: 100, seconds: Math.round(getDuration()), ts: Date.now(), event: 'full_listen', loop: count });
      // Auto-advance to the next card instead of looping the same track —
      // looping on 'ended' was the "songs keep repeating" bug. Real Resso
      // moves on to the next song in the feed when one finishes.
      advanceToNextSong();
    });
    audioEl.addEventListener('error', () => { mode = 'none'; setBuffering(false); setPlayIcon(false); });
  }

  function togglePlayPause(){
    if (mode === 'audio' && audioEl){
      if (audioEl.paused) audioEl.play().catch(()=>{}); else audioEl.pause();
    }
  }

  function getCurrentTime(){
    return (mode === 'audio' && audioEl) ? (audioEl.currentTime || 0) : 0;
  }
  function getDuration(){
    return (mode === 'audio' && audioEl) ? (audioEl.duration || 0) : 0;
  }
  function seekTo(t){
    if (mode === 'audio' && audioEl) audioEl.currentTime = t;
  }

  function setPlayIcon(playing){
    document.querySelectorAll('.play-indicator').forEach(el => {
      el.classList.toggle('hidden', playing);
    });
  }

  function setBuffering(active){
    document.querySelectorAll('.buffering-indicator').forEach(el => {
      el.classList.toggle('hidden', !active);
    });
  }

  /* ---------------------------------------------------------------------
   * FEED / CARD RENDERING
   * ------------------------------------------------------------------- */
  const feedEl = document.getElementById('feed');
  const ambientBg = document.getElementById('ambientBg');
  let songs = [];
  let activeIndex = -1;
  let activeStartTime = 0; // currentTime when card became active, for percent baseline
  let progressTimer = null;
  let lastLyricIndex = -1;

  function fmtTime(s){
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return `${m}:${sec.toString().padStart(2,'0')}`;
  }

  function cardHTML(song, i){
    const liked = likes.includes(song.id);

    return `
    <div class="song-card relative w-full snap-start snap-always overflow-hidden" style="height:100dvh;" data-index="${i}" data-id="${song.id}">
      <!-- album artwork backdrop — ultra-HD (1000x1000) crop attempted first;
           data-quality-chain lets onerror step down to 500x500/150x150
           before finally giving up on a grey placeholder. -->
      <img src="${song.artwork}" loading="eager"
           data-quality-chain='${JSON.stringify(song.artworkFallbacks || [])}'
           onerror="window.__artStepDown(this, 'https://placehold.co/600x600/1a1a1f/fff?text=%E2%99%AB')"
           class="absolute inset-0 w-full h-full object-cover scale-110" alt="" />
      <!-- subtle bottom-only gradient, just for the bottom UI controls legibility — wallpaper stays fully visible everywhere else -->
      <div class="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-b from-transparent to-black/60 pointer-events-none"></div>

      <!-- top bar -->
      <div class="absolute top-0 inset-x-0 z-20 flex items-center justify-between px-4 pt-3 pb-8 bg-gradient-to-b from-black/70 to-transparent">
        <span class="text-white/70 text-lg leading-none">⌄</span>
        <span class="text-[11px] font-semibold tracking-widest text-white/60 uppercase">For You</span>
        <span class="w-4"></span>
      </div>

      <!-- lyrics zone: top of screen. No scrim panel — wallpaper stays
           fully visible. Readability now comes entirely from a much
           heavier text-stroke + text-shadow stack on the lyric text
           itself (see .lyric-line rules), boosted ~200% over before. -->
      <div class="lyrics-scroll absolute inset-x-0 z-10 flex flex-col items-center justify-start gap-1.5 px-8 text-center overflow-hidden pointer-events-none" style="top:16%; bottom:48%;">
        ${song.lyrics && song.lyrics.length ? '' : `<p class="text-amber-200/70 text-base font-semibold">No synced lyrics found for this track.</p>`}
      </div>

      <!-- play indicator (shown when paused) -->
      <div class="play-indicator hidden absolute inset-0 z-20 flex items-center justify-center pointer-events-none">
        <div class="w-16 h-16 rounded-full bg-black/50 flex items-center justify-center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>

      <!-- buffering indicator (shown while audio is loading) -->
      <div class="buffering-indicator hidden absolute inset-0 z-20 flex items-center justify-center pointer-events-none">
        <div class="spinner"></div>
      </div>

      <!-- right action bar: frosted-glass circles, Resso signature -->
      <div class="absolute right-3 z-20 flex flex-col items-center gap-6" style="bottom:12rem;">
        <button class="likeBtn flex flex-col items-center gap-1" data-id="${song.id}">
          <span class="heart w-12 h-12 rounded-full action-glass flex items-center justify-center text-2xl">${liked ? '❤️' : '🤍'}</span>
          <span class="text-[10px] text-white/70 font-medium">Like</span>
        </button>
        <button class="commentBtn flex flex-col items-center gap-1">
          <span class="w-12 h-12 rounded-full action-glass flex items-center justify-center text-2xl">💬</span>
          <span class="text-[10px] text-white/70 font-medium">Comment</span>
        </button>
        <button class="shareBtn flex flex-col items-center gap-1">
          <span class="w-12 h-12 rounded-full action-glass flex items-center justify-center text-2xl">↗️</span>
          <span class="text-[10px] text-white/70 font-medium">Share</span>
        </button>
        <div class="w-12 h-12 rounded-full action-glass flex items-end justify-center gap-0.5 pb-2.5">
          <span class="eq-bar w-1 h-2 bg-white rounded-full"></span>
          <span class="eq-bar w-1 h-4 bg-white rounded-full"></span>
          <span class="eq-bar w-1 h-3 bg-white rounded-full"></span>
          <span class="eq-bar w-1 h-4.5 bg-white rounded-full"></span>
        </div>
      </div>

      <!-- bottom info panel — solid gradient so lyrics never show through -->
      <div class="absolute bottom-0 inset-x-0 z-20 px-4 pt-16 pb-6 bg-gradient-to-t from-black via-black/95 to-transparent">
        <h2 class="text-lg font-bold leading-tight truncate mb-2">${escapeHTML(song.title)}</h2>
        <div class="flex flex-wrap gap-1.5 mb-3">
          ${song.album ? `<button class="browse-chip text-[10px] px-2.5 py-1 rounded-full bg-white/10 border border-white/10 active:bg-white/20" data-type="movie" data-value="${escapeHTML(song.album)}">🎬 ${escapeHTML(song.album)}</button>` : ''}
          ${(song.artistList||[]).slice(0,3).map(a => `<button class="browse-chip text-[10px] px-2.5 py-1 rounded-full bg-white/10 border border-white/10 active:bg-white/20" data-type="artist" data-value="${escapeHTML(a)}">🎤 ${escapeHTML(a)}</button>`).join('')}
          ${song.language ? `<button class="browse-chip text-[10px] px-2.5 py-1 rounded-full bg-white/10 border border-white/10 active:bg-white/20" data-type="genre" data-value="${escapeHTML(song.language)}">🎵 ${escapeHTML(song.language.charAt(0).toUpperCase() + song.language.slice(1))}</button>` : ''}
        </div>
        <div class="progress-wrap w-full h-1.5 bg-white/15 rounded-full overflow-hidden cursor-pointer">
          <div class="progress-fill h-full bg-white rounded-full" style="width:0%"></div>
        </div>
        <div class="flex justify-between mt-1.5 text-[11px] text-white/50">
          <span class="cur-time">0:00</span>
          <span class="dur-time">0:00</span>
        </div>
      </div>
    </div>`;
  }

  function escapeHTML(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function appendSongs(newSongs){
    const startIdx = songs.length;
    songs = songs.concat(newSongs);
    const frag = document.createElement('div');
    frag.innerHTML = newSongs.map((s,i) => cardHTML(s, startIdx+i)).join('');
    [...frag.children].forEach(child => feedEl.appendChild(child));
    wireCard(newSongs, startIdx);
    observeCards();
  }

  function wireCard(newSongs, startIdx){
    newSongs.forEach((song, i) => {
      const idx = startIdx + i;
      const card = feedEl.querySelector(`.song-card[data-index="${idx}"]`);
      if (!card) return;

      card.addEventListener('click', (e) => {
        if (e.target.closest('.likeBtn, .commentBtn, .shareBtn, .progress-wrap, .browse-chip')) return;
        togglePlayPause();
      });

      card.querySelectorAll('.browse-chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          openBrowse(chip.dataset.type, chip.dataset.value);
        });
      });

      card.querySelector('.likeBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const nowLiked = toggleLike(song.id);
        const heart = e.currentTarget.querySelector('.heart');
        heart.textContent = nowLiked ? '❤️' : '🤍';
        heart.classList.remove('heart-pop'); void heart.offsetWidth; heart.classList.add('heart-pop');
        showToast(nowLiked ? 'Added to Liked Songs' : 'Removed from Liked Songs');
      });

      card.querySelector('.commentBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        showToast('Comments coming soon 💬');
      });

      card.querySelector('.shareBtn').addEventListener('click', async (e) => {
        e.stopPropagation();
        const shareData = { title: song.title, text: `${song.title} — ${song.artist}`, url: location.href };
        if (navigator.share) { try { await navigator.share(shareData); } catch(e){} }
        else { try { await navigator.clipboard.writeText(`${song.title} — ${song.artist}`); showToast('Copied to clipboard'); } catch(e){ showToast('Share unavailable'); } }
      });

      const progWrap = card.querySelector('.progress-wrap');
      progWrap.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = progWrap.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        const dur = getDuration();
        if (dur > 0 && idx === activeIndex) seekTo(pct * dur);
      });
    });
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    t.classList.remove('toast'); void t.offsetWidth; t.classList.add('toast');
    setTimeout(()=> t.classList.add('hidden'), 2000);
  }

  /* ---------------------------------------------------------------------
   * SEARCH & BROWSE (by movie/artist/genre)
   * Reuses the same fetchSaavnBatch() the feed already uses — one search
   * endpoint, works the same for a typed query or a tapped chip. Results
   * are prepared "lite" (metadata only) for a fast list; the full song
   * (with lyrics) is only fetched once the user actually taps to play it,
   * then it's appended to the feed and the view jumps to it.
   * ------------------------------------------------------------------- */
  let searchResultSongs = [];
  let searchDebounce = null;

  function resultItemHTML(song, idx){
    return `
    <button class="result-item w-full flex items-center gap-3 p-2 rounded-xl active:bg-white/10 text-left" data-idx="${idx}">
      <img src="${song.artwork}" onerror="this.src='https://placehold.co/100x100/1a1a1f/fff?text=%E2%99%AB'" class="w-12 h-12 rounded-lg object-cover flex-shrink-0" loading="lazy" alt="" />
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold truncate">${escapeHTML(song.title)}</p>
        <p class="text-xs text-white/50 truncate">${escapeHTML(song.artist)}${song.album ? ' · ' + escapeHTML(song.album) : ''}</p>
      </div>
      <span class="text-white/30 text-lg flex-shrink-0">▶</span>
    </button>`;
  }

  async function runSearch(query, statusLabel){
    const statusEl = document.getElementById('searchStatus');
    const resultsEl = document.getElementById('searchResults');
    if (!query || !query.trim()){
      resultsEl.innerHTML = '';
      statusEl.textContent = 'Search for songs, artists, or movies';
      return;
    }
    statusEl.textContent = 'Searching…';
    resultsEl.innerHTML = '';
    try {
      const raw = await fetchSaavnBatch(query.trim(), 20);
      const allowed = raw.filter(isAllowedLanguage);
      const seen = new Set();
      const unique = allowed.filter(r => r.id && !seen.has(r.id) && seen.add(r.id));
      searchResultSongs = unique.map(prepareLiteSong);
      if (!searchResultSongs.length){
        statusEl.textContent = `No results for "${query}"`;
        return;
      }
      statusEl.textContent = statusLabel || `Results for "${query}"`;
      resultsEl.innerHTML = searchResultSongs.map((s, i) => resultItemHTML(s, i)).join('');
      resultsEl.querySelectorAll('.result-item').forEach(btn => {
        btn.addEventListener('click', () => playFromSearch(parseInt(btn.dataset.idx, 10)));
      });
    } catch(e){
      statusEl.textContent = 'Search failed — check your connection and try again';
    }
  }

  async function playFromSearch(i){
    const picked = searchResultSongs[i];
    if (!picked) return;
    closeSearchModal();
    showToast(`Adding "${picked.title}" to your feed…`);
    const full = await prepareSong(picked.raw).catch(()=>null);
    if (!full || !full.audioUrl){ showToast('Could not play this track'); return; }
    seenTrackKeys.add(rawTrackKey(picked.raw));
    appendSongs([full]);
    const newIdx = songs.length - 1;
    requestAnimationFrame(() => goToCard(newIdx, true));
  }

  function openSearch(){
    const modal = document.getElementById('searchModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('searchStatus').textContent = 'Search for songs, artists, or movies';
    document.getElementById('searchInput').focus();
  }

  function openBrowse(type, value){
    const modal = document.getElementById('searchModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.getElementById('searchInput').value = value;
    const prefix = type === 'movie' ? 'Songs from' : type === 'artist' ? 'More by' : 'More';
    runSearch(value, `${prefix} "${value}"`);
  }

  function closeSearchModal(){
    const modal = document.getElementById('searchModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  document.getElementById('searchBtn').addEventListener('click', openSearch);
  document.getElementById('closeSearch').addEventListener('click', closeSearchModal);
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    const q = e.target.value;
    searchDebounce = setTimeout(() => runSearch(q), 400);
  });
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ clearTimeout(searchDebounce); runSearch(e.target.value); }
  });

  /* ---------------------------------------------------------------------
   * INTERSECTION OBSERVER — drives which card is "active"
   *
   * A naive "first entry that crosses 60%" approach double-fires during
   * the scroll-snap settle: as you flick from card A to card B, A's ratio
   * dips below 0.6 and B's rises above it, but on some devices A can
   * transiently re-cross 0.6 again before the snap fully settles. That
   * fired activateCard(A) *after* activateCard(B) had already started
   * loading B's audio — cancelling B and restarting A, which is exactly
   * the "new song plays for a moment, then the old one comes back by
   * itself" bug. Fix: track every card's live ratio, and only commit to
   * whichever card has the HIGHEST ratio after a short quiet period
   * (debounce) once the observer stops sending new events — i.e. once
   * the scroll has actually settled.
   * ------------------------------------------------------------------- */
  let io = null;
  const cardRatios = new Map(); // index -> intersection ratio
  let activationDebounce = null;

  function observeCards(){
    if (io) io.disconnect();
    cardRatios.clear();
    io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const idx = parseInt(entry.target.dataset.index, 10);
        cardRatios.set(idx, entry.intersectionRatio);
      });
      scheduleActivation();
    }, { threshold: [0, 0.25, 0.5, 0.6, 0.75, 0.9, 1] });
    document.querySelectorAll('.song-card').forEach(c => io.observe(c));
  }

  function scheduleActivation(){
    clearTimeout(activationDebounce);
    activationDebounce = setTimeout(() => {
      let bestIdx = activeIndex;
      let bestRatio = activeIndex >= 0 ? (cardRatios.get(activeIndex) || 0) : -1;
      cardRatios.forEach((ratio, idx) => {
        if (ratio > bestRatio){ bestRatio = ratio; bestIdx = idx; }
      });
      if (bestIdx !== activeIndex && bestRatio > 0.55){
        activateCard(bestIdx);
      }
    }, 120); // ~120ms of quiet == scroll has settled on a card
  }

  // Programmatic navigation to a specific card (used by search-jump and
  // auto-advance-on-end). Disconnects the IntersectionObserver for the
  // move and calls activateCard directly, then reconnects once settled —
  // otherwise scrolling past intermediate cards briefly crosses the
  // observer's activation threshold on each one, which was why a searched
  // song only started playing after several other cards had flickered by.
  function goToCard(idx, instant){
    if (io) io.disconnect();
    const card = feedEl.querySelector(`.song-card[data-index="${idx}"]`);
    if (card) card.scrollIntoView({ behavior: instant ? 'auto' : 'smooth', block: 'start' });
    activateCard(idx);
    observeCards();
  }

  async function advanceToNextSong(){
    const nextIdx = activeIndex + 1;
    if (nextIdx >= songs.length){
      await loadMore();
      if (nextIdx >= songs.length) return; // nothing more to load right now
    }
    goToCard(nextIdx);
  }

  function activateCard(idx){
    // log exit data for previous card
    if (activeIndex !== -1 && songs[activeIndex]){
      const prev = songs[activeIndex];
      const cur = getCurrentTime();
      const dur = getDuration();
      const percent = dur > 0 ? Math.min(100, Math.round((cur/dur)*100)) : 0;
      logHistory({ id: prev.id, title: prev.title, artist: prev.artist, percent, seconds: Math.round(cur), ts: Date.now(), event: 'swipe_away' });
    }

    activeIndex = idx;
    lastLyricIndex = -1;
    const song = songs[idx];
    if (!song) return;

    // Preload first: assigning a broken/blocked URL straight to
    // background-image just silently keeps showing whatever the *previous*
    // song's art was, which looks like "the image never updates".
    const preload = new Image();
    // Same 1000x1000 → 500x500 → 150x150 step-down as the foreground
    // artwork img, so the blurred ambient backdrop is also the best
    // quality actually available for this track, not a silently-failed
    // 1000x1000 request leaving the previous song's wallpaper stuck.
    const ambientChain = [song.artwork, ...(song.artworkFallbacks || [])];
    let ambientTry = 0;
    const tryAmbientLoad = () => {
      if (ambientTry >= ambientChain.length) { console.warn('[artwork] all qualities failed', song.artwork); return; }
      const url = ambientChain[ambientTry];
      preload.onload = () => { if (activeIndex === idx) ambientBg.style.backgroundImage = `url('${url}')`; };
      preload.onerror = () => { ambientTry++; tryAmbientLoad(); };
      preload.src = url;
    };
    tryAmbientLoad();
    setPlayIcon(true);
    playSong(song);

    // lazy-load more when near the end
    if (idx >= songs.length - 2) loadMore();
  }

  /* ---------------------------------------------------------------------
   * PROGRESS + LYRIC SYNC LOOP
   * ------------------------------------------------------------------- */
  function startProgressLoop(){
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(() => {
      if (activeIndex === -1) return;
      const song = songs[activeIndex];
      if (!song) return;
      const card = feedEl.querySelector(`.song-card[data-index="${activeIndex}"]`);
      if (!card) return;

      const cur = getCurrentTime();
      const dur = getDuration();
      const pct = dur > 0 ? Math.min(100, (cur/dur)*100) : 0;

      const fill = card.querySelector('.progress-fill');
      if (fill) fill.style.width = pct + '%';
      const curEl = card.querySelector('.cur-time');
      const durEl = card.querySelector('.dur-time');
      if (curEl) curEl.textContent = fmtTime(cur);
      if (durEl) durEl.textContent = fmtTime(dur);

      if (song.lyrics && song.lyrics.length){
        let idx = -1;
        for (let i=0;i<song.lyrics.length;i++){ if (song.lyrics[i].time <= cur) idx = i; else break; }
        if (idx !== lastLyricIndex){
          lastLyricIndex = idx;
          renderLyricsWindow(card, song, idx);
        }
      }
    }, 250);
  }

  // Two-line lyrics display: current line highlighted on top, next line
  // dimmed directly below it — no history stacking, just what's playing
  // now and what's coming next.
  function renderLyricsWindow(card, song, idx){
    const container = card.querySelector('.lyrics-scroll');
    if (!container || idx < 0) return;
    const current = song.lyrics[idx];
    const next = song.lyrics[idx + 1];
    // truncate keeps each line to a single row (no wrap reading like a
    // 3rd line). No background box — the golden colour + text-shadow do
    // the readability work now, not a dark scrim.
    let html = `<p class="lyric-line active text-[19px] sm:text-[24px] leading-snug w-full tracking-tight" style="display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word;">${escapeHTML(current.text)}</p>`;
    if (next){
      html += `<p class="lyric-line next-line text-[13px] sm:text-[16px] leading-snug w-full tracking-tight" style="display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word;">${escapeHTML(next.text)}</p>`;
    }
    container.innerHTML = html;
  }

  /* ---------------------------------------------------------------------
   * STATS MODAL
   * ------------------------------------------------------------------- */
  function renderStats(){
    const body = document.getElementById('statsBody');
    likes = getLS(LS_LIKES, []);
    history = getLS(LS_HISTORY, []);
    loops = getLS(LS_LOOPS, {});

    const totalLoops = Object.values(loops).reduce((a,b)=>a+b,0);
    const avgPercent = history.length ? Math.round(history.reduce((a,h)=>a+(h.percent||0),0)/history.length) : 0;

    body.innerHTML = `
      <div class="flex justify-between"><span>Liked songs</span><b>${likes.length}</b></div>
      <div class="flex justify-between"><span>Tracked plays</span><b>${history.length}</b></div>
      <div class="flex justify-between"><span>Full loops (replays)</span><b>${totalLoops}</b></div>
      <div class="flex justify-between"><span>Avg. listen %</span><b>${avgPercent}%</b></div>
      <hr class="border-white/10 my-2" />
      <p class="text-white/50 text-xs mb-1">Recent activity</p>
      ${history.slice(-6).reverse().map(h => `<div class="flex justify-between text-xs text-white/60"><span class="truncate pr-2">${escapeHTML(h.title)}</span><span>${h.percent}%</span></div>`).join('') || '<p class="text-xs text-white/30">No activity yet — keep swiping.</p>'}
    `;
  }

  document.getElementById('statsBtn').addEventListener('click', () => {
    renderStats();
    document.getElementById('statsModal').classList.remove('hidden');
    document.getElementById('statsModal').classList.add('flex');
  });
  document.getElementById('closeStats').addEventListener('click', () => {
    document.getElementById('statsModal').classList.add('hidden');
    document.getElementById('statsModal').classList.remove('flex');
  });

  /* ---------------------------------------------------------------------
   * LOAD MORE / BOOTSTRAP
   * ------------------------------------------------------------------- */
  let loadingMore = false;
  async function loadMore(){
    if (loadingMore) return;
    loadingMore = true;
    try {
      const more = await fetchQueue(6);
      const existingIds = new Set(songs.map(s=>s.id));
      const filtered = more.filter(s => !existingIds.has(s.id));
      if (filtered.length) appendSongs(filtered);
    } finally {
      loadingMore = false;
    }
  }

  window.addEventListener('beforeunload', () => {
    if (activeIndex !== -1 && songs[activeIndex]){
      const cur = getCurrentTime(), dur = getDuration();
      const percent = dur > 0 ? Math.round((cur/dur)*100) : 0;
      logHistory({ id: songs[activeIndex].id, title: songs[activeIndex].title, artist: songs[activeIndex].artist, percent, seconds: Math.round(cur), ts: Date.now(), event: 'unload' });
    }
  });

  // Boots the feed the instant the page opens — no tap needed just to
  // *see* the player. Cards render (artwork, lyrics zone, bottom info
  // panel) as soon as data arrives; the only thing still gated behind a
  // tap is starting audio, which every browser requires a real user
  // gesture for. That gate is now a small pill over the already-visible
  // first card, not a full-screen splash blocking the player.
  async function bootFeed(){
    const overallTimeout = new Promise((resolve) => setTimeout(() => { lastFetchError = lastFetchError || 'timed out after 40s'; resolve([]); }, 40000));
    const initial = await Promise.race([fetchQueue(8), overallTimeout]);
    if (!initial.length){
      // Figure out WHERE the failure actually is, instead of guessing:
      // if a known-reachable endpoint (iTunes, used only for this test)
      // also fails, the device itself has no working network route right
      // now. If iTunes works but every Piped instance doesn't, those
      // specific hosts are being blocked (common with some Indian
      // ISPs/DNS for unofficial YouTube-proxy front-ends) — a VPN or
      // different network (WiFi vs mobile data, or vice versa) usually
      // gets past that.
      let deviceOnline = false;
      try {
        const r = await fetchWithTimeout('https://itunes.apple.com/search?term=test&limit=1', 6000);
        deviceOnline = r.ok;
      } catch(e){ deviceOnline = false; }

      const diagnosis = deviceOnline
        ? `Your device is online, but none of 5 independent JioSaavn mirrors — direct or through any of 4 CORS relays — could be reached just now. This is a strong signal that this category of unofficial music API/proxy is blocked on this network, or all of them are down simultaneously. Try mobile data ↔ WiFi, or a VPN, then Retry.`
        : `Your device doesn't seem to have a working internet connection right now — check your WiFi/mobile data and try again.`;
      const reason = lastFetchError ? ` (last error: ${lastFetchError})` : '';

      document.getElementById('loadingWrap').innerHTML = `
        <p class="text-white/50 text-xs max-w-xs">${diagnosis}${reason}</p>
        <button id="retryBtn" class="mt-4 px-6 py-2 rounded-full glass text-xs font-semibold pointer-events-auto">Retry</button>
      `;
      document.getElementById('retryBtn').addEventListener('click', () => location.reload());
      return;
    }

    // Songs are ready — render the feed right away (artwork/lyrics UI
    // visible immediately) and swap the loading spinner for a compact
    // tap-to-play pill, without ever hiding the player behind black.
    appendSongs(initial);
    document.getElementById('loadingWrap').classList.add('hidden');
    const tapWrap = document.getElementById('tapPlayWrap');
    tapWrap.classList.remove('hidden');
    tapWrap.classList.add('flex');
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startOverlay').classList.add('hidden');
    startProgressLoop();
    activateCard(0);
  });

  bootFeed();

})();
</script>
</body>
</html>
